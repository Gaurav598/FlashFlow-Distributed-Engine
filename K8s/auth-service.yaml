apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: flashflow-ns
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: auth-service
          image: gaurav598/auth-service:v1
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - { name: MONGO_URI, value: "mongodb://mongodb:27017/auth_db" }
            - { name: JWT_ISSUER, value: "flashflow-auth" }
            - { name: JWT_AUDIENCE, value: "flashflow-api" }
          envFrom:
            - secretRef:
                name: flashflow-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /health/ready, port: 3001 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: flashflow-ns
spec:
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
